  <style>html{scroll-behavior:smooth}body{font-family:'Manrope',sans-serif;background:#0a0a0a;color:#FAF8F5}.panel{min-height:100vh;display:flex;align-items:center}.video-bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(0.4)}.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(0,0,0,0.7) 100%);z-index:-1}.btn{display:inline-flex;background:#E85D4C;color:#fff;padding:14px 28px;border-radius:999px;font-weight:600}.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:24px}input,select,textarea{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px;width:100%;color:#fff}</style>
